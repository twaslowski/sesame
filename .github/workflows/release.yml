name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.ref_name }}

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check tag against Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$TAG" = "v$version" ] || { echo "Tag $TAG does not match Cargo.toml version $version"; exit 1; }
      - run: gh release create "$TAG" --draft --verify-tag --generate-notes

  build:
    needs: create
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, name: Darwin_arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: Darwin_x86_64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: Linux_x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: Linux_arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: rustup update --no-self-update stable && rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: |
          tar -czf sesame_${{ matrix.name }}.tar.gz -C target/${{ matrix.target }}/release sesame
          gh release upload "$TAG" sesame_${{ matrix.name }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        run: |
          gh release download "$TAG" --pattern '*.tar.gz'
          sha256sum *.tar.gz > "sesame_${TAG#v}_checksums.txt"
          gh release upload "$TAG" "sesame_${TAG#v}_checksums.txt"
          gh release edit "$TAG" --draft=false
      # deploy key on homebrew-tap; GITHUB_TOKEN can't push to other repos
      - name: Update cask in twaslowski/homebrew-tap
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          sha() { sha256sum "sesame_$1.tar.gz" | cut -d' ' -f1; }
          url="https://github.com/$GH_REPO/releases/download/v#{version}"
          mkdir -p ~/.ssh
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$HOMEBREW_TAP_DEPLOY_KEY"
          git clone --depth 1 git@github.com:twaslowski/homebrew-tap.git tap
          cat > tap/Casks/sesame.rb <<EOF
          # Generated by github.com/$GH_REPO release.yml. DO NOT EDIT.
          cask "sesame" do
            version "${TAG#v}"

            on_macos do
              on_arm do
                sha256 "$(sha Darwin_arm64)"
                url "$url/sesame_Darwin_arm64.tar.gz"
              end
              on_intel do
                sha256 "$(sha Darwin_x86_64)"
                url "$url/sesame_Darwin_x86_64.tar.gz"
              end
            end
            on_linux do
              on_arm do
                sha256 "$(sha Linux_arm64)"
                url "$url/sesame_Linux_arm64.tar.gz"
              end
              on_intel do
                sha256 "$(sha Linux_x86_64)"
                url "$url/sesame_Linux_x86_64.tar.gz"
              end
            end

            name "sesame"
            desc "Terminal UI for browsing AWS Secrets Manager"
            homepage "https://github.com/$GH_REPO"

            binary "sesame"

            # unsigned binary; Gatekeeper blocks it otherwise
            postflight do
              if OS.mac?
                system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/sesame"]
              end
            end
          end
          EOF
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/sesame.rb
          git commit -m "sesame ${TAG#v}"
          git push
